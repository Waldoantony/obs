<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Bolet Lakay — Kontwòl</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="top">
  <h1>🎛 Bolet Lakay — Kontwòl</h1>
  <div class="status" id="connStatus">Koneksyon...</div>
</header>

<div class="container">

  <div class="toolbar">
    <label><input type="checkbox" id="animateToggle" checked> Anime nouvo rezilta</label>
    <label><input type="checkbox" id="bgFullToggle"> Fon konplè (pa transparan)</label>
    <label><input type="checkbox" id="liveToggle" checked> Montre badge LIVE</label>
  </div>

  <div class="card" style="--accent:#a855f7">
    <h2>🎨 Koulè background (mòd fon konplè)</h2>
    <div class="field-row">
      <div class="flabel">Koulè 1</div>
      <input type="color" id="bgColor1" value="#0e1b33" style="width:60px;height:48px;padding:2px;border-radius:10px;border:2px solid #26365c;background:#0b142a;">
      <div class="flabel" style="width:auto;margin-left:10px">Koulè 2</div>
      <input type="color" id="bgColor2" value="#060b16" style="width:60px;height:48px;padding:2px;border-radius:10px;border:2px solid #26365c;background:#0b142a;">
    </div>
    <div style="font-size:13px;color:#94a3b8;margin-top:4px">Chanjman an aplike sou OBS imedyatman, san ou pa bezwen touche kòd.</div>
  </div>

  <!-- Florida spotlight (Pick 3 / Pick 4) -->
  <div class="card" style="--accent:#ef4444">
    <h2>🟥 Rezilta Tiraj FLORIDA (Pick 3 / Pick 4)</h2>
    <div class="field-row">
      <div class="flabel">Tit</div>
      <input type="text" id="draw-subtitle" placeholder="Maten • Samedi 05 Septembre 2026">
    </div>
    <div class="field-row">
      <div class="flabel">Pick 3</div>
      <input type="text" id="draw-pick3" maxlength="3" placeholder="ex: 911">
      <button class="eye-btn" id="eye-pick3">👁</button>
    </div>
    <button class="reveal-btn" id="reveal-pick3">✨ REVEAL PICK 3</button>
    <div class="field-row" style="margin-top:14px">
      <div class="flabel">Pick 4</div>
      <input type="text" id="draw-pick4" maxlength="4" placeholder="ex: 4567">
      <button class="eye-btn" id="eye-pick4">👁</button>
    </div>
    <button class="reveal-btn" id="reveal-pick4">✨ REVEAL PICK 4</button>
  </div>

  <!-- State cards injected here by admin.js -->
  <div id="statesContainer"></div>

  <!-- Presets -->
  <div class="card" style="--accent:#ffd60a">
    <h2>💾 Preset</h2>
    <div class="preset-row">
      <input type="text" id="presetName" placeholder="Non preset (ex: Maten 05 Sept)">
      <button id="savePreset">Anrejistre</button>
    </div>
    <div class="preset-list" id="presetList"></div>
  </div>

  <!-- Danger zone -->
  <div class="card" style="--accent:#ef4444">
    <h2>⚠️ Reset</h2>
    <div class="danger-row">
      <button class="danger-btn" id="resetToday">RESET TODAY</button>
      <button class="danger-btn" id="clearAll">CLEAR ALL</button>
    </div>
  </div>

</div>

<button class="update-btn" id="updateAllBtn">⬆️ UPDATE ALL RESULTS</button>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
